[project]
name = "llm-fullstack"
version = "0.1.0"
description = "Agentic RAG support assistant: LangGraph supervisor over a RAG specialist and an MCP actions specialist, served on a quantized vLLM model."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "mcp>=1.0.0",
    "openai>=2.46.0",
    "httpx>=0.28.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_fullstack"]
